name: Extract MonoFrame source
on:
  push:
    paths:
      - ".github/workflows/extract-source.yml"
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode application source
        run: |
          cat app-part1.txt app-part2.txt app-part3.txt app-part4.txt app-part5.txt | tr -d '\n\r ' | base64 -d | gzip -d > app-source.html
          test -s app-source.html
      - name: Commit readable source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-source.html
          git commit -m "Extract readable MonoFrame source" || exit 0
          git push
