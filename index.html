<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f5f7">
<title>MonoFrame</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f7;color:#20252d;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:420px;margin:24px;padding:28px;background:white;border:1px solid #e4e7eb;border-radius:18px;text-align:center}
strong{font-size:23px;letter-spacing:-.8px}p{color:#727984;line-height:1.5}#status{font-size:13px}
</style>
</head>
<body>
<main><strong>MonoFrame</strong><p id="status">Подготовка приложения…</p></main>
<script>
(async()=>{
 const base="https://raw.githubusercontent.com/vdovichenkonikita11-netizen/MonoFrame/main/";
 try{
  const names=["app-part1.txt","app-part2.txt","app-part3.txt","app-part4.txt","app-part5.txt"];
  const chunks=await Promise.all(names.map(async name=>{
   const response=await fetch(base+name);
   if(!response.ok) throw new Error("Не удалось загрузить компонент "+name);
   return response.text();
  }));
  const encoded=chunks.join("");
  const binary=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
  if(!("DecompressionStream" in window)) throw new Error("Обновите Safari или Chrome до актуальной версии.");
  const stream=new Blob([binary]).stream().pipeThrough(new DecompressionStream("gzip"));
  const source=await new Response(stream).text();
  document.open();document.write(source);document.close();
 }catch(error){
  document.getElementById("status").textContent="Не удалось запустить приложение: "+error.message;
 }
})();
</script>
</body>
</html>
